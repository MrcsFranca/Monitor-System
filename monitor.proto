// protobuff é uma IDL (interface definition language)
// Serve para definir as mensagens e os serviços. Este arquivo não depende de uma linguagem em 
// Esse arquivo serve de entrada para o protoc (compilador) que gera arquivos que fazer o trabalho de stub (cria funções que o cliente chama achando que está local, mas está remoto) e skeleton (cria a infra que recebe a requisição da rede, decodifica os dados e entrega pronto para a aplicação rodar)

syntax = "proto3";

package monitor;

service MetricService {
  rpc StreamMetrics (stream MetricRequest) returns (stream MetricResponse);
}

message MetricRequest {
  // Cada valor é um identificador de posição
  string client_id = 1;
  float cpu = 2;
  float memory = 3;
  float disk = 4;
}

message MetricResponse {
  string message = 1;
}
